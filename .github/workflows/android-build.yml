name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify APK and write SHA-256 checksum
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > SHA256SUMS)
          cat "$(dirname "$apk")/SHA256SUMS"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  instrumented-checkpoint-tests:
    name: Verify transcript checkpoints on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -PclipforgeEmulatorTest=true --stacktrace
            # Instrumentation can uninstall the target app during test cleanup; reinstall the built APK.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.clipforge.app | grep -F package:
            # Smoke-check the installed app process, not just instrumentation tests.
            adb shell am force-stop com.clipforge.app || true
            adb logcat -c
            adb shell monkey -p com.clipforge.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.clipforge.app | grep -E '[0-9]+' || { echo "ClipForge did not remain running after launch"; adb logcat -d -t 300; exit 1; }
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-android-instrumentation
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
